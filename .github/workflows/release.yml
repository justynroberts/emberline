name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   rid: osx-arm64, script: build/package-macos.sh,   arg: arm64 }
          # Cross-published from Apple Silicon. The macos-13 image is being
          # retired, and a job asking for it never gets a runner — it sits queued
          # for ever and holds the whole workflow at "queued" even though every
          # other job has passed. dotnet publish -r osx-x64 produces a real
          # x86_64 binary from an arm64 host, verified with file(1).
          - { os: macos-latest,   rid: osx-x64,   script: build/package-macos.sh,   arg: x86_64 }
          - { os: windows-latest, rid: win-x64,   script: build/package-windows.sh, arg: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64, script: build/package-linux.sh,   arg: linux-x64 }

    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Signing, when the certificate is available.
      #
      # Without it the macOS builds are ad-hoc signed and Gatekeeper tells whoever
      # downloads them that the application is damaged. The step is skipped rather
      # than failed when the secrets are absent, so a fork can still build.
      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(uuidgen)

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: bash ${{ matrix.script }} ${{ matrix.arg }}

      # macOS gets a disk image, which is what a Mac user expects to download:
      # a window with the application and a shortcut to Applications beside it.
      # Everything else gets a zip.
      - name: Archive
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            bash build/package-dmg.sh "${{ matrix.rid }}"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cd dist && 7z a "emberline-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          else
            cd dist && zip -qry "emberline-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: emberline-${{ matrix.rid }}
          path: |
            dist/emberline-${{ matrix.rid }}.zip
            dist/emberline-${{ matrix.rid }}.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
          generate_release_notes: true
          body: |
            > ### This drives a laser
            >
            > Emberline connects to and commands a laser engraver or cutter. A laser
            > powerful enough to mark wood is powerful enough to set it alight and to
            > start a fire that spreads while you are looking at a screen. Never leave a
            > running machine unattended, extract the fumes, wear eye protection rated
            > for your wavelength, and treat the stop button in the application as a
            > convenience rather than a safety device — the switch on the machine is the
            > one that counts.
            >
            > Provided as is, without warranty of any kind. Use entirely at your own risk.
            >
            > **This release has never completed a job on real hardware.** Preview the
            > toolpath, frame the outline at pointer power, and start from settings you
            > have tested on an offcut.

            ## Installing

            **macOS** — open the `.dmg` and drag Emberline to Applications.

            **Windows** — unzip anywhere and run `Emberline.exe`. No installer, no runtime to install.

            **Linux** — unzip and run `./Emberline`.

            No account, no cloud, no telemetry. Press **Virtual** to try it without a machine.
