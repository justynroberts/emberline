name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Skia renders through fontconfig on Linux. The runners do not have it, and
      # without it libSkiaSharp loads but cannot enumerate a single font.
      - name: Linux font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore
        run: dotnet restore OpenBurn.slnx

      - name: Build
        run: dotnet build OpenBurn.slnx -c Release --no-restore

      # The whole suite runs against the in-process GRBL simulator and the
      # synthetic camera, so no hardware is needed on any runner.
      - name: Test
        run: dotnet test OpenBurn.slnx -c Release --no-build --verbosity normal

  package:
    name: Package ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   rid: osx-arm64, script: build/package-macos.sh,   arg: arm64 }
          - { os: macos-13,       rid: osx-x64,   script: build/package-macos.sh,   arg: x86_64 }
          - { os: windows-latest, rid: win-x64,   script: build/package-windows.sh, arg: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64, script: build/package-linux.sh,   arg: linux-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Linux self-test renders text, which needs fontconfig.
      - name: Linux font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Package
        shell: bash
        run: bash ${{ matrix.script }} ${{ matrix.arg }}

      # Verify the packaged artefact, not just the source tree: this catches a
      # build that compiled but was assembled without its device profiles.
      - name: Self-test the package
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          if [ -d "dist/${{ matrix.rid }}/OpenBurn.app" ]; then
            "dist/${{ matrix.rid }}/OpenBurn.app/Contents/MacOS/OpenBurn" --selftest
          else
            "dist/${{ matrix.rid }}/OpenBurn" --selftest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openburn-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
