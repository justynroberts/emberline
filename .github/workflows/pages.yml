name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The site is static and self-contained — no build step, because a landing page
# that needs a toolchain is a landing page that stops publishing the first time
# the toolchain moves.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled: a half-finished
# publish that loses to a newer one leaves the live site on whichever commit
# happened to win the race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      # enablement turns Pages on if it is off, rather than failing and waiting
      # for somebody to find the setting. Without it the first run on a fresh
      # clone or a fork dies on "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
